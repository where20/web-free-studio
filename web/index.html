<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Free Studio · 本地视频工作台</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e5e8ec; --ink:#1b1f24; --sub:#63707e;
    --brand:#2f6df6; --brand-soft:#eaf1ff; --ok:#0f9d58; --warn:#b26a00; --err:#c53030;
    --chip:#f1f3f6; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .hwrap{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.2px}
  .logo i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#2f6df6,#7aa7ff);display:inline-block}
  .logo small{font-weight:400;color:var(--sub);font-size:12px}
  .grow{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--sub);font-size:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:#c3c9d1}
  .dot.online{background:var(--ok)} .dot.challenge{background:var(--warn)} .dot.error,.dot.logged_out{background:var(--err)} .dot.new{background:#8b95a1}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:9px;cursor:pointer;transition:.15s}
  button:hover{border-color:#c9d2dd;background:#fbfcfe}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{filter:brightness(1.05)}
  button.ghost{background:transparent}
  button:disabled{opacity:.55;cursor:not-allowed}
  main{max-width:1320px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:18px;align-items:start}
  @media (max-width:960px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .card h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:8px}
  .card .body{padding:14px 16px}
  label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px}
  textarea,input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
  textarea{min-height:120px;resize:vertical;line-height:1.55}
  textarea:focus,input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .acct{display:flex;flex-direction:column;gap:8px}
  .acct .item{border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:9px}
  .acct .item.active{border-color:var(--brand);background:var(--brand-soft)}
  .acct .meta{flex:1;min-width:0}
  .acct .name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct .sub{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct .ops{display:flex;gap:6px}
  .acct .ops button{padding:4px 8px;font-size:11.5px;border-radius:7px}
  .tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .task{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .task .media{aspect-ratio:16/9;background:#0d1117;position:relative;display:flex;align-items:center;justify-content:center}
  .task .media img,.task .media video{width:100%;height:100%;object-fit:cover;display:block}
  .task .media .ph{color:#8b95a1;font-size:12px;text-align:center;padding:8px}
  .badge{position:absolute;top:8px;left:8px;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:#33404d;font-weight:600}
  .badge.done{color:var(--ok)} .badge.pending,.badge.queued,.badge.running{color:var(--warn)} .badge.failed,.badge.error{color:var(--err)}
  .badge.local{left:auto;right:8px;background:#e8f7ee;color:var(--ok)}
  .task .info{padding:10px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
  .task .p{font-size:12.5px;color:#33404d;line-height:1.5;max-height:3em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .task .tags{display:flex;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
  .task .tags span{background:var(--chip);padding:2px 7px;border-radius:6px}
  .task .foot{display:flex;gap:6px;padding:0 11px 11px}
  .task .foot button{flex:1;padding:5px 8px;font-size:11.5px;border-radius:8px}
  .empty{padding:44px 16px;text-align:center;color:var(--sub)}
  .log{max-height:220px;overflow:auto;font:12px/1.7 var(--mono);padding:10px 16px;color:#4a5765}
  .log div{white-space:pre-wrap;word-break:break-all}
  .log .t{color:#98a2b3;margin-right:8px}
  .toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast div{background:#1b1f24;color:#fff;padding:9px 13px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow);max-width:420px}
  .toast div.err{background:#8f2222}
  .hint{font-size:11.5px;color:var(--sub);margin-top:6px}
  .kpi{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub)}
  .kpi b{color:var(--ink);font-size:15px;display:block;font-weight:650}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo"><i></i>Free Studio <small>本地视频工作台</small></div>
    <div class="grow"></div>
    <span class="pill" id="live"><span class="dot"></span><span>连接中…</span></span>
    <span class="pill" id="syncinfo">尚未同步</span>
    <button id="btnSyncAll" class="primary">同步全部</button>
  </div>
</header>

<main>
  <section class="card">
    <h3>新建生成</h3>
    <div class="body">
      <label class="f">账号</label>
      <select id="account"></select>
      <label class="f">画面描述（prompt）</label>
      <textarea id="prompt" placeholder="描述画面、动作、镜头和声音，例如：少女立于朱红门廊前，鎏金唐装，镜头缓慢推近，宫灯流转……"></textarea>
      <div class="row3">
        <div><label class="f">模型</label>
          <select id="model">
            <option value="minimax-h3-flash">MiniMax H3 Flash（免费）</option>
            <option value="minimax-h3-flash-vip">MiniMax H3 Flash VIP</option>
            <option value="minimax-h3">MiniMax H3</option>
          </select></div>
        <div><label class="f">时长(秒)</label><input id="duration" type="number" min="4" max="15" value="5" /></div>
        <div><label class="f">清晰度</label>
          <select id="resolution"><option value="768p">768P</option><option value="576p">576P</option></select></div>
      </div>
      <div class="row">
        <div><label class="f">画幅</label>
          <select id="ratio">
            <option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option><option>3:4</option><option>21:9</option>
          </select></div>
        <div><label class="f">种子（可空）</label><input id="seed" type="number" placeholder="随机" /></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button id="btnGen" class="primary" style="flex:1">提交生成</button>
        <button id="btnSync" class="ghost">刷新记录</button>
      </div>
      <div class="hint">提交走本机浏览器通道（真实指纹 + 账号 cookie）；记录与成片自动镜像到 <code>data/assets/</code>。</div>
    </div>
  </section>

  <section class="card">
    <h3>账号池 <span class="pill" id="acctCount" style="margin-left:auto">0</span></h3>
    <div class="body acct" id="accounts"></div>
    <h3 style="border-top:1px solid var(--line)">生成记录 <span class="pill" id="taskCount" style="margin-left:auto">0</span></h3>
    <div class="kpi" id="kpi"></div>
    <div class="body">
      <div class="tasks" id="tasks"></div>
      <div class="empty" id="empty" hidden>还没有记录。提交一条生成，或点「同步全部」拉取上游历史。</div>
    </div>
  </section>
</main>

<section class="card" style="max-width:1320px;margin:0 auto 28px;width:calc(100% - 40px)">
  <h3>同步日志</h3>
  <div class="log" id="log"></div>
</section>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let STATE = { accounts: [], tasks: [], log: [] };
let activeAccount = localStorage.getItem("fs.account") || "";

function toast(msg, err = false) {
  const div = document.createElement("div");
  if (err) div.className = "err";
  div.textContent = msg;
  $("toast").appendChild(div);
  setTimeout(() => div.remove(), 4200);
}

async function api(path, opts) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

const fmtBytes = (n) => (n > 1e9 ? (n / 1e9).toFixed(2) + " GB" : n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : (n || 0) + " B");
const fmtTime = (ts) => (ts ? new Date(ts).toLocaleString("zh-CN", { hour12: false }) : "-");

function renderAccounts() {
  const box = $("accounts");
  const list = STATE.accounts.filter((a) => a.status !== "removed");
  $("acctCount").textContent = list.length;
  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = `<div class="hint">还没有账号。终端运行 <code>npm run account</code> 新增并授权（每个账号独立浏览器 profile）。</div>`;
  }
  for (const a of list) {
    const item = document.createElement("div");
    item.className = "item" + (a.id === activeAccount ? " active" : "");
    item.innerHTML = `
      <span class="dot ${a.status}"></span>
      <div class="meta">
        <div class="name">${a.label || a.id}</div>
        <div class="sub">${a.upstreamUserId || "未授权"} · 免费已用 ${a.freeUsedToday ?? "-"} · ${a.lastError || a.status}</div>
      </div>
      <div class="ops">
        <button data-op="pick">选用</button>
        <button data-op="sync">同步</button>
        <button data-op="login">授权</button>
        ${a.needsChallenge ? '<button data-op="challenge">验证</button>' : ""}
      </div>`;
    item.querySelectorAll("button").forEach((b) => {
      b.onclick = async (e) => {
        e.stopPropagation();
        const op = b.dataset.op;
        if (op === "pick") { activeAccount = a.id; localStorage.setItem("fs.account", a.id); renderAccounts(); renderForm(); return; }
        b.disabled = true;
        try {
          if (op === "sync") { await api(`/api/accounts/${a.id}/sync`, { method: "POST" }); toast("已同步 " + a.label); }
          if (op === "login") { toast("已打开登录窗口，请完成授权…"); await api(`/api/accounts/${a.id}/login`, { method: "POST" }); toast("授权成功"); }
          if (op === "challenge") { toast("已打开人机验证窗口，请在弹窗内完成验证…"); await api(`/api/accounts/${a.id}/challenge`, { method: "POST" }); toast("验证完成"); }
          await refresh();
        } catch (err) { toast(err.message, true); }
        finally { b.disabled = false; }
      };
    });
    box.appendChild(item);
  }
}

function renderForm() {
  const sel = $("account");
  const list = STATE.accounts.filter((a) => a.status === "online" || a.status === "challenge");
  sel.innerHTML = list.map((a) => `<option value="${a.id}">${a.label}（免费已用 ${a.freeUsedToday ?? 0}）</option>`).join("");
  if (activeAccount && list.some((a) => a.id === activeAccount)) sel.value = activeAccount;
  else if (list[0]) { activeAccount = list[0].id; sel.value = activeAccount; }
  sel.onchange = () => { activeAccount = sel.value; localStorage.setItem("fs.account", activeAccount); renderAccounts(); };
}

function renderTasks() {
  const box = $("tasks");
  const tasks = STATE.tasks;
  $("taskCount").textContent = tasks.length;
  const done = tasks.filter((t) => t.status === "done");
  const local = tasks.filter((t) => t.asset?.video);
  $("kpi").innerHTML = `
    <div><b>${tasks.length}</b>总任务</div>
    <div><b>${done.length}</b>已完成</div>
    <div><b>${local.length}</b>已落本地</div>
    <div><b>${fmtBytes(local.reduce((s, t) => s + (t.asset?.bytes || 0), 0))}</b>本地资产</div>`;
  $("empty").hidden = tasks.length > 0;
  box.innerHTML = "";
  for (const t of tasks.slice(0, 120)) {
    const el = document.createElement("div");
    el.className = "task";
    const localUrl = t.asset?.video ? "/assets/" + t.asset.video.split("/assets/")[1] : "";
    const thumb = localUrl.replace(/\.mp4$/, ".jpg");
    let media;
    if (localUrl) {
      media = `<video src="${localUrl}" poster="${thumb}" preload="metadata" muted playsinline controls></video><span class="badge local">本地</span>`;
    } else if (t.video?.thumb_url) {
      media = `<img src="${t.video.thumb_url}" alt="" /><span class="badge local" style="background:#fff5e5;color:#b26a00">待镜像</span>`;
    } else {
      media = `<div class="ph">${t.status === "done" ? "成片待同步" : "生成中…"}</div>`;
    }
    el.innerHTML = `
      <div class="media"><span class="badge ${t.status}">${t.status}</span>${media}</div>
      <div class="info">
        <div class="p" title="${(t.prompt || "").replace(/"/g, "&quot;")}">${t.prompt || "(无提示词)"}</div>
        <div class="tags">
          <span>${t.model || "-"}</span><span>${t.duration || "-"}s</span>
          <span>${t.resolution || "-"}</span><span>${t.aspectRatio || "-"}</span>
          ${t.billing?.free ? "<span>免费</span>" : t.billing?.cost ? `<span>${t.billing.cost}</span>` : ""}
          <span>${fmtTime(t.upstreamCreatedAt)}</span>
        </div>
      </div>
      <div class="foot">
        <button data-op="copy">复用提示词</button>
        <button data-op="play">${localUrl ? "打开文件" : "查看上游"}</button>
        <button data-op="del">删除</button>
      </div>`;
    el.querySelector('[data-op="copy"]').onclick = () => { $("prompt").value = t.prompt || ""; $("duration").value = t.duration || 5; window.scrollTo({ top: 0, behavior: "smooth" }); };
    el.querySelector('[data-op="play"]').onclick = () => {
      if (localUrl) window.open(localUrl, "_blank");
      else window.open("https://www.paba.tv/v1/videos/" + t.upstreamId + "/content", "_blank");
    };
    el.querySelector('[data-op="del"]').onclick = async () => {
      if (!confirm("从上游删除这条记录？本地已下载的成片会保留。")) return;
      try { await api(`/api/tasks/${t.accountId}/${t.upstreamId}`, { method: "DELETE" }); toast("已删除"); await refresh(); }
      catch (e) { toast(e.message, true); }
    };
    box.appendChild(el);
  }
}

function renderLog() {
  const box = $("log");
  box.innerHTML = STATE.log.slice(0, 80).map((l) =>
    `<div><span class="t">${new Date(l.at).toLocaleTimeString("zh-CN", { hour12: false })}</span>${l.kind ? "[" + l.kind + "] " : ""}${l.message || ""}</div>`
  ).join("");
}

function renderSyncInfo() {
  const online = STATE.accounts.filter((a) => a.status === "online");
  const last = Math.max(0, ...STATE.accounts.map((a) => a.lastSyncAt || 0));
  $("syncinfo").textContent = last ? `上次同步 ${new Date(last).toLocaleTimeString("zh-CN", { hour12: false })} · 在线 ${online.length}` : `在线 ${online.length}`;
}

async function refresh() {
  STATE = await api("/api/state");
  renderAccounts(); renderForm(); renderTasks(); renderLog(); renderSyncInfo();
}

$("btnGen").onclick = async () => {
  const prompt = $("prompt").value.trim();
  if (!prompt) return toast("先写提示词", true);
  const btn = $("btnGen");
  btn.disabled = true; btn.textContent = "提交中…";
  try {
    const out = await api("/api/generate", {
      method: "POST",
      body: JSON.stringify({
        accountId: $("account").value || undefined,
        prompt,
        model: $("model").value,
        duration: Number($("duration").value),
        resolution: $("resolution").value,
        aspectRatio: $("ratio").value,
        seed: $("seed").value || undefined,
      }),
    });
    toast("已提交 " + out.upstreamId);
    await refresh();
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = "提交生成"; }
};

$("btnSync").onclick = async () => {
  const id = $("account").value;
  try { if (id) await api(`/api/accounts/${id}/sync`, { method: "POST" }); else await api("/api/sync", { method: "POST" }); await refresh(); }
  catch (e) { toast(e.message, true); }
};
$("btnSyncAll").onclick = async () => {
  const b = $("btnSyncAll"); b.disabled = true; b.textContent = "同步中…";
  try { await api("/api/sync", { method: "POST" }); await refresh(); toast("同步完成"); }
  catch (e) { toast(e.message, true); }
  finally { b.disabled = false; b.textContent = "同步全部"; }
};

function connect() {
  const es = new EventSource("/api/events");
  const live = $("live");
  es.onopen = () => { live.innerHTML = '<span class="dot online"></span><span>实时在线</span>'; };
  es.onerror = () => { live.innerHTML = '<span class="dot error"></span><span>已断开</span>'; };
  es.addEventListener("task", (e) => { const d = JSON.parse(e.data); toast("任务 " + d.upstreamId + " → " + d.status); refresh(); });
  es.addEventListener("asset", (e) => { const d = JSON.parse(e.data); toast("已落本地 " + fmtBytes(d.bytes)); refresh(); });
  es.addEventListener("sync", () => refresh());
  es.addEventListener("sync_error", (e) => { const d = JSON.parse(e.data); toast("同步失败：" + d.message, true); refresh(); });
  es.addEventListener("login", (e) => { const d = JSON.parse(e.data); if (d.phase === "ok") toast("账号授权成功"); });
  es.addEventListener("log", () => refresh());
}

refresh().then(connect).catch((e) => toast("加载失败：" + e.message, true));
setInterval(refresh, 15000);
</script>
</body>
</html>
